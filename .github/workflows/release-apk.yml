name: Build & Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # EXPO_TOKEN and EXPO_PUBLIC_EXCHANGE_RATE_API_KEY are secrets of this environment.
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          # Defaults to yarn; this project uses npm only.
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # The "preview" profile in eas.json builds an APK (android.buildType = apk).
      # /android is gitignored, so EAS runs prebuild (CNG) before the Gradle build.
      # Branch names may contain "/" (e.g. feat/x), so swap it for "-" in the file name.
      - name: Build APK
        id: apk
        env:
          # EXPO_PUBLIC_* vars are inlined into the JS bundle at build time (.env is not in git).
          EXPO_PUBLIC_EXCHANGE_RATE_API_KEY: ${{ secrets.EXPO_PUBLIC_EXCHANGE_RATE_API_KEY }}
        run: |
          name="spendlens-${GITHUB_REF_NAME//\//-}.apk"
          eas build -p android --profile preview --local --non-interactive \
            --output "$GITHUB_WORKSPACE/$name"
          echo "file=$name" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.file }}
          generate_release_notes: true

      # Manual runs (workflow_dispatch) only keep the APK as an artifact.
      - name: Upload artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: spendlens-apk
          path: ${{ steps.apk.outputs.file }}
